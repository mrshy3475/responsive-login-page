<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Login Page</title>
</head>

<body>

    <div class="container" id="container">

        <!-- SIGN UP -->
        <div class="form-container sign-up">
            <form onsubmit="event.preventDefault(); signupUser();">
                <h1>Create Account</h1>

                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>

                <span>or use your email for registration</span>

                <input type="text" placeholder="Name" id="signup-name" required>
                <input type="email" placeholder="Email" id="signup-email" required>

                <div class="password-wrapper">
                    <input type="password" placeholder="Password" id="signup-password" required>
                    <i class="fa fa-eye" id="togglePassword"></i>
                </div>

                <div class="password-wrapper">
                    <input type="password" placeholder="Confirm Password" id="confirm-password" required>
                    <i class="fa fa-eye" id="toggleConfirmPassword"></i>
                </div>

                <p id="password-warning" style="visibility:hidden;color:red;">
                    Passwords do not match
                </p>

                <div class="checkbox-container">
                    <input type="checkbox" id="terms-checkbox">
                    <label for="terms-checkbox">I agree to all terms & conditions</label>
                </div>

                <button id="signup-btn" type="submit">Sign Up</button>
            </form>
        </div>

        <!-- SIGN IN -->
        <div class="form-container sign-in">
            <form onsubmit="event.preventDefault(); loginUser();">
                <h1>Sign In</h1>

                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>

                <span>or use your email password</span>

                <input type="email" placeholder="Email" id="login-email" required>

                <div class="password-wrapper">
                    <input type="password" placeholder="Password" id="login-password" required>
                    <i class="fa fa-eye" id="toggleLoginPassword"></i>
                </div>

                <a href="#">Forget Your Password?</a>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <!-- TOGGLE -->
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all site features</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Don't have an Account?</h1>
                    <p>Register with your personal details to use all site features</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>

    </div>

    <!-- YOUR UI JS -->
    <script src="script.js"></script>

    <!-- FIREBASE AUTH -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-mRtd8KPHfZ2_ztV9px3Z9B_Jkd6yZyU",
            authDomain: "job-finder-login-c7053.firebaseapp.com",
            projectId: "job-finder-login-c7053"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // SIGN UP
        window.signupUser = function () {
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("Signup successful! Please sign in.");
                    document.getElementById("login").click();
                })
                .catch(error => alert(error.message));
        };

        // LOGIN
        window.loginUser = function () {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("Login successful");
                    window.location.href = "dashboard.html";
                })
                .catch(error => alert(error.message));
        };
    </script>

</body>
</html>
</html>
